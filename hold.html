        <section class="ftco-section bg-light" id="tilmelding">
            <div class="container bg-light">
                <div class="row justify-content-center mb-5">
                    <div class="col-md-8 text-center heading-section ftco-animate">
                        <h2>Tilmeld dit hold</h2>
                        <p>Fortæl os lidt om jeres gruppe, så vender vi tilbage med et oplæg og et par ledige datoer. Felterne åbner din e-mailklient med oplysningerne, når du trykker send.</p>
                    </div>
                </div>
                <div class="row block-9 justify-content-center">
                    <div class="col-md-8">
                        <form data-mailto-form="hej@eventur.dk" data-subject="Tilmelding af hold" novalidate>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="navn">Navn</label>
                                        <input type="text" class="form-control" id="navn" name="Navn" placeholder="Dit navn" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="email">E-mail</label>
                                        <input type="email" class="form-control" id="email" name="E-mail" placeholder="dig@eksempel.dk" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="telefon">Telefon</label>
                                        <input type="tel" class="form-control" id="telefon" name="Telefon" placeholder="+45 12 34 56 78">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="antal">Antal deltagere</label>
                                        <input type="number" min="1" class="form-control" id="antal" name="Antal deltagere" value="5">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="dato">Ønsket dato</label>
                                        <input type="date" class="form-control" id="dato" name="Ønsket dato">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="tur">Tur</label>
                                        <select class="form-control" id="tur" name="Tur">
                                            <option>Shelter og rødvin</option>
                                            <option>Hængekøje og hjemmelavet øl</option>
                                            <option>Økser, hulebyg, bål og mjød</option>
                                            <option>Ved ikke endnu – kom med et forslag</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <div class="form-group">
                                        <label for="besked">Besked</label>
                                        <textarea class="form-control" id="besked" name="Besked" rows="5" placeholder="Fortæl os om jeres gruppe og jeres ønsker"></textarea>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <div class="form-group">
                                        <input type="submit" value="Send tilmelding" class="btn btn-primary py-3 px-5">
                                    </div>
                                    <p class="form-status" role="status" aria-live="polite"></p>
                                    <p class="small text-muted">Vil du hellere skrive direkte? Send en mail til <a href="mailto:hej@eventur.dk">hej@eventur.dk</a>.</p>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
